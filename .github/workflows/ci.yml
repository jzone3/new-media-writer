name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project NewMediaWriter.xcodeproj -scheme NewMediaWriter
          -configuration Debug -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build | tail -20
      - run: scripts/test-export.sh
