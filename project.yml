name: NewMediaWriter
options:
  bundleIdPrefix: com.jzone3
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  NewMediaWriter:
    type: application
    platform: macOS
    sources:
      - path: NewMediaWriter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jzone3.NewMediaWriter
        PRODUCT_NAME: New Media Writer
        INFOPLIST_FILE: NewMediaWriter/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
